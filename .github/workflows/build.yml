name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ChameleonBar-windows-x64
          path: |
            build/bin/Release/ChameleonBar.exe
            build/bin/Release/ChameleonBar.XamlBridge.dll
            README.md
            Setup and Troubleshooting.txt
            LICENSE.txt
            THIRD_PARTY_NOTICES.md
